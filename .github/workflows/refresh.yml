name: Refresh data

# GitHub сам запускает это расписание — компьютер может быть выключен.
on:
  schedule:
    - cron: "0 2 * * *"    # каждый день, 05:00 МСК — афиша событий
    - cron: "30 2 * * 1"   # каждый понедельник, 05:30 МСК — каталог групп
  workflow_dispatch:
    inputs:
      full:
        description: "Пересобрать каталог групп (медленно, ~10 минут)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Зависимости
        run: pip install -r tools/requirements.txt

      - name: Подготовка
        run: mkdir -p build

      - name: Афиша событий
        run: |
          python tools/scrape_events.py
          python tools/publish.py

      - name: Каталог групп
        if: github.event.schedule == '30 2 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.full == true)
        run: |
          python tools/scrape.py
          python tools/build_dataset.py
          python tools/publish.py

      - name: Коммит
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "data: обновление $(date -u +%F)"
          git push
